version: "3.8"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: assettracker-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: assettracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assettracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: assettracker-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/assettracker
      UDP_PORT: 5683
    ports:
      - "8000:8000"
      - "5683:5683/udp"
    volumes:
      - ./backend:/app/backend
      - ./dashboard:/app/dashboard

volumes:
  pgdata:
